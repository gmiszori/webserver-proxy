# Overlay for tests/smoke.sh: the production proxy in front of two stub apps,
# isolated from a real deployment by its own network, subnet and loopback ports.
services:
  haproxy:
    ports: !override
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:18443:8443"
    networks: !override
      webserver:
        ipv4_address: 172.31.251.2

  vault:
    image: &caddy caddy:2.11-alpine@sha256:70b3180738b46cd88e49b300d790ae448a0aca3f58edef0f000bb57d619a9ab3
    environment: {NAME: vault, SITE: vault.test, EDGE_PROXY_CIDR: 172.31.251.2/32}
    volumes: [./tests/stub.Caddyfile:/etc/caddy/Caddyfile:ro]
    networks:
      webserver:
        aliases: [vault]

  amoeba:
    image: *caddy
    environment: {NAME: amoeba, SITE: amoeba.test, EDGE_PROXY_CIDR: 172.31.251.2/32}
    volumes: [./tests/stub.Caddyfile:/etc/caddy/Caddyfile:ro]
    networks:
      webserver:
        aliases: [amoeba]

  mensa:
    image: *caddy
    environment: {NAME: mensa, SITE: mensa.test, EDGE_PROXY_CIDR: 172.31.251.2/32}
    volumes: [./tests/stub.Caddyfile:/etc/caddy/Caddyfile:ro]
    networks:
      webserver:
        aliases: [mensa]

networks:
  webserver:
    name: webserver-test
    ipam:
      config: !override
        - subnet: 172.31.251.0/24
          ip_range: 172.31.251.128/25
          gateway: 172.31.251.1
