# Edge proxy for every site on this host. It owns host ports 80 and 443 and
# routes each connection by hostname to the matching app's own Caddy:
#   443: TLS passes through untouched (routed by SNI); the app's Caddy holds
#        the certificate and terminates TLS.
#   80:  routed by Host header, for HTTP->HTTPS redirects and ACME HTTP-01.
# Every forwarded connection starts with a PROXY v2 header carrying the
# visitor's address, so the apps' per-IP limits still see real clients.

global
	log stdout format raw local0
	maxconn 4096

defaults
	log global
	option dontlognull
	timeout connect 5s
	timeout client 1m
	timeout server 1m
	# Idle limit once a connection is established in both directions. Game
	# WebSockets and slow vault uploads stay open far longer than a request;
	# the apps' Caddy servers enforce their own, tighter limits.
	timeout tunnel 1h
	timeout client-fin 30s
	timeout server-fin 30s

# Docker's embedded DNS. Backends resolve at runtime, so this proxy starts
# (and keeps running) while an app is down or being redeployed.
resolvers docker
	nameserver dns 127.0.0.11:53
	hold valid 10s

frontend https
	mode tcp
	bind :8443
	option tcplog
	tcp-request inspect-delay 5s
	tcp-request content accept if { req.ssl_hello_type 1 }
	use_backend vault_https if { req.ssl_sni -i "${VAULT_DOMAIN}" }
	use_backend amoeba_https if { req.ssl_sni -i "${AMOEBA_DOMAIN}" }
	# No default backend: unknown names and IP-only requests are closed.

frontend http
	mode http
	bind :8080
	timeout http-request 10s
	# Like the apps' own logs: no URIs or headers.
	log-format "%ci:%cp [%tr] %ft %b/%s %ST %B %Tt"
	acl host_vault req.hdr(host),field(1,:) -i "${VAULT_DOMAIN}"
	acl host_amoeba req.hdr(host),field(1,:) -i "${AMOEBA_DOMAIN}"
	http-request reject unless host_vault or host_amoeba
	use_backend vault_http if host_vault
	use_backend amoeba_http if host_amoeba

# Server names are network aliases on the shared "webserver" network.
backend vault_https
	mode tcp
	server vault vault:443 send-proxy-v2 resolvers docker init-addr libc,none

backend vault_http
	mode http
	# A PROXY header describes one client; never share a server connection.
	http-reuse never
	server vault vault:80 send-proxy-v2 resolvers docker init-addr libc,none

backend amoeba_https
	mode tcp
	server amoeba amoeba:443 send-proxy-v2 resolvers docker init-addr libc,none

backend amoeba_http
	mode http
	http-reuse never
	server amoeba amoeba:80 send-proxy-v2 resolvers docker init-addr libc,none
